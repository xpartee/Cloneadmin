<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Console - Admin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0b0c;
      color: #ffffff;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }
    .admin-container { width: 100%; max-width: 480px; }
    .header { margin-bottom: 24px; border-bottom: 1px solid #2c2c2e; padding-bottom: 16px; }
    .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 13px; color: #8e8e93; }
    .card {
      background-color: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #3b82f6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group { display: flex; flex-direction: column; margin-bottom: 14px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label { font-size: 13px; color: #8e8e93; margin-bottom: 6px; }
    .input-row { display: flex; gap: 12px; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      background-color: #000000;
      border: 1px solid #3a3a3c;
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: #3b82f6; }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-save { background-color: #22c55e; color: #ffffff; }
    .btn-reset { background-color: #2c2c2e; color: #8e8e93; }
    .btn:active { opacity: 0.8; }
    .status-toast {
      display: none;
      background-color: #22c55e22;
      border: 1px solid #22c55e;
      color: #22c55e;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="admin-container">
  <div class="header">
    <h1>Configuration Console</h1>
    <p>Manage system passkeys, timers, and failure routes.</p>
  </div>

  <div id="toast" class="status-toast">Settings successfully updated!</div>

  <div class="card">
    <div class="card-title">Authentication Passkeys</div>
    <div class="form-group">
      <label for="initialKey">Page 2 Passkey (Initial Transfer)</label>
      <input type="text" id="initialKey" placeholder="e.g. 4444" />
    </div>
    <div class="form-group">
      <label for="adminKey">Page 5 Password (Admin Installation)</label>
      <input type="text" id="adminKey" placeholder="e.g. 5048" />
    </div>
  </div>

  <div class="card">
    <div class="card-title">Simulation Timers (Seconds)</div>
    <div class="input-row">
      <div class="form-group" style="flex: 1;">
        <label for="transferSec">Phase 1 Transfer</label>
        <input type="number" id="transferSec" min="1" placeholder="e.g. 60" />
      </div>
      <div class="form-group" style="flex: 1;">
        <label for="installSec">Phase 2 Install</label>
        <input type="number" id="installSec" min="1" placeholder="e.g. 600" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Device IDs</div>
    <div class="form-group">
      <label for="sourceId">Source Device ID</label>
      <input type="text" id="sourceId" placeholder="e.g. 557278992656998" />
    </div>
    <div class="form-group">
      <label for="targetId">Target Device ID</label>
      <input type="text" id="targetId" placeholder="e.g. 352703943015910" />
    </div>
  </div>

  <div class="card">
    <div class="card-title">Terminal State (Page 7)</div>
    <div class="form-group">
      <label for="finalStatus">Post-Installation Behavior</label>
      <select id="finalStatus">
        <option value="fail">Fail (Device Not Compatible)</option>
        <option value="success">Success (Migration Complete)</option>
      </select>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-reset" onclick="resetDefaults()">Reset Defaults</button>
    <button class="btn btn-save" onclick="saveSettings()">Save Configuration</button>
  </div>
</div>

<script>
  // Default values
  const defaultSettings = {
    initialKey: '4444',
    adminKey: '5048',
    transferSec: 60,
    installSec: 600,
    sourceId: '557278992656998',
    targetId: '352703943015910',
    finalStatus: 'fail'
  };

  // --- STORAGE LAYER (Swap to Firebase fetch() later if needed) ---
  function getStoredConfig() {
    const raw = localStorage.getItem('device_migration_config');
    return raw ? JSON.parse(raw) : defaultSettings;
  }

  function setStoredConfig(data) {
    localStorage.setItem('device_migration_config', JSON.stringify(data));
  }
  // -------------------------------------------------------------

  function loadSettings() {
    const config = getStoredConfig();
    document.getElementById('initialKey').value = config.initialKey;
    document.getElementById('adminKey').value = config.adminKey;
    document.getElementById('transferSec').value = config.transferSec;
    document.getElementById('installSec').value = config.installSec;
    document.getElementById('sourceId').value = config.sourceId;
    document.getElementById('targetId').value = config.targetId;
    document.getElementById('finalStatus').value = config.finalStatus;
  }

  function saveSettings() {
    const config = {
      initialKey: document.getElementById('initialKey').value || defaultSettings.initialKey,
      adminKey: document.getElementById('adminKey').value || defaultSettings.adminKey,
      transferSec: parseInt(document.getElementById('transferSec').value, 10) || defaultSettings.transferSec,
      installSec: parseInt(document.getElementById('installSec').value, 10) || defaultSettings.installSec,
      sourceId: document.getElementById('sourceId').value || defaultSettings.sourceId,
      targetId: document.getElementById('targetId').value || defaultSettings.targetId,
      finalStatus: document.getElementById('finalStatus').value
    };

    setStoredConfig(config);

    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2000);
  }

  function resetDefaults() {
    localStorage.removeItem('device_migration_config');
    loadSettings();
  }

  window.addEventListener('DOMContentLoaded', loadSettings);
</script>
</body>
</html>
