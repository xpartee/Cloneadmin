<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <!-- Firebase SDKs (Compat mode for direct browser usage) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0b0c;
      color: #ffffff;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 440px; }
    .card {
      background-color: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 16px;
      padding: 24px 20px;
      margin-bottom: 16px;
    }
    h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: #8e8e93; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; margin-bottom: 14px; }
    label { font-size: 13px; color: #8e8e93; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      background-color: #000000;
      border: 1px solid #3a3a3c;
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: #3b82f6; }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary { background-color: #22c55e; color: #ffffff; }
    .btn-auth { background-color: #3b82f6; color: #ffffff; }
    .btn-secondary { background-color: #2c2c2e; color: #8e8e93; margin-top: 10px; }
    .error-msg { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }
    .toast {
      display: none;
      background-color: #22c55e22;
      border: 1px solid #22c55e;
      color: #22c55e;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 600;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">

  <!-- LOGIN VIEW -->
  <div id="authSection" class="card">
    <h2>Admin Login</h2>
    <p class="sub">Sign in with your Firebase admin credentials.</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="adminEmail" placeholder="admin@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="adminPass" placeholder="••••••••" />
    </div>
    <button class="btn btn-auth" onclick="handleLogin()">Sign In</button>
    <div id="loginError" class="error-msg"></div>
  </div>

  <!-- CONTROL PANEL VIEW -->
  <div id="panelSection" class="hidden">
    <div id="toast" class="toast">Settings successfully updated in Firebase!</div>

    <div class="card">
      <h2>System Controls</h2>
      <p class="sub" id="userEmailDisplay"></p>

      <div class="form-group">
        <label>Passkey (Page 2)</label>
        <input type="text" id="initialKey" />
      </div>

      <div class="form-group">
        <label>Password (Page 5)</label>
        <input type="text" id="adminKey" />
      </div>

      <div class="form-group">
        <label>Phase 1 Transfer Duration (Seconds)</label>
        <input type="number" id="transferSec" />
      </div>

      <div class="form-group">
        <label>Phase 2 Install Duration (Seconds)</label>
        <input type="number" id="installSec" />
      </div>

      <div class="form-group">
        <label>Source Device ID</label>
        <input type="text" id="sourceId" />
      </div>

      <div class="form-group">
        <label>Target Device ID</label>
        <input type="text" id="targetId" />
      </div>

      <div class="form-group">
        <label>Post-Install Status (Page 7)</label>
        <select id="finalStatus">
          <option value="fail">Fail (Device Not Compatible)</option>
          <option value="success">Success (Complete)</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="saveSettings()">Save Configuration</button>
      <button class="btn btn-secondary" onclick="handleLogout()">Sign Out</button>
    </div>
  </div>

</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDzdoHy1pf4G92ziT5hs_AlZS1NnDB3A2g",
    authDomain: "cloneadmin-720cf.firebaseapp.com",
    projectId: "cloneadmin-720cf",
    storageBucket: "cloneadmin-720cf.firebasestorage.app",
    messagingSenderId: "894712205413",
    appId: "1:894712205413:web:1a3843b339f51cbff7368c",
    databaseURL: "https://cloneadmin-720cf-default-rtdb.firebaseio.com"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('panelSection').classList.remove('hidden');
      document.getElementById('userEmailDisplay').innerText = 'Logged in as: ' + user.email;
      loadSettings();
    } else {
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('panelSection').classList.add('hidden');
    }
  });

  function handleLogin() {
    const email = document.getElementById('adminEmail').value.trim();
    const pass = document.getElementById('adminPass').value;
    const errorBox = document.getElementById('loginError');
    errorBox.style.display = 'none';

    auth.signInWithEmailAndPassword(email, pass)
      .catch(err => {
        errorBox.innerText = err.message;
        errorBox.style.display = 'block';
      });
  }

  function handleLogout() {
    auth.signOut();
  }

  function loadSettings() {
    db.ref('migration_config').once('value').then(snapshot => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('initialKey').value = data.initialKey || '4444';
        document.getElementById('adminKey').value = data.adminKey || '5048';
        document.getElementById('transferSec').value = data.transferSec || 60;
        document.getElementById('installSec').value = data.installSec || 600;
        document.getElementById('sourceId').value = data.sourceId || '557278992656998';
        document.getElementById('targetId').value = data.targetId || '352703943015910';
        document.getElementById('finalStatus').value = data.finalStatus || 'fail';
      }
    });
  }

  function saveSettings() {
    const payload = {
      initialKey: document.getElementById('initialKey').value,
      adminKey: document.getElementById('adminKey').value,
      transferSec: parseInt(document.getElementById('transferSec').value, 10) || 60,
      installSec: parseInt(document.getElementById('installSec').value, 10) || 600,
      sourceId: document.getElementById('sourceId').value,
      targetId: document.getElementById('targetId').value,
      finalStatus: document.getElementById('finalStatus').value,
      updatedAt: Date.now()
    };

    db.ref('migration_config').set(payload)
      .then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
      })
      .catch(err => alert("Error saving: " + err.message));
  }
</script>
</body>
</html>
