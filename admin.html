<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Control Console</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0b0c;
      color: #ffffff;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .admin-container { width: 100%; max-width: 480px; }
    .header { margin-bottom: 24px; border-bottom: 1px solid #2c2c2e; padding-bottom: 16px; }
    .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 13px; color: #8e8e93; }
    .card {
      background-color: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #3b82f6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group { display: flex; flex-direction: column; margin-bottom: 14px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label { font-size: 13px; color: #8e8e93; margin-bottom: 6px; }
    .input-row { display: flex; gap: 12px; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      background-color: #000000;
      border: 1px solid #3a3a3c;
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: #3b82f6; }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-save { background-color: #22c55e; color: #ffffff; }
    .btn-reset { background-color: #2c2c2e; color: #8e8e93; }
    .btn:active { opacity: 0.8; }
    .status-toast {
      display: none;
      background-color: #22c55e22;
      border: 1px solid #22c55e;
      color: #22c55e;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 600;
    }

    /* Login Modal */
    #loginGate {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: #1c1c1e;
      padding: 28px 20px;
      border-radius: 16px;
      border: 1px solid #2c2c2e;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .login-box h3 { font-size: 18px; margin-bottom: 6px; }
    .login-box p { font-size: 13px; color: #8e8e93; margin-bottom: 18px; }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    .pin-error {
      color: #ef4444;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

<!-- Master Authentication Gate -->
<div id="loginGate">
  <div class="login-box">
    <h3>Admin Authorization</h3>
    <p>Enter master PIN to manage configurations.</p>
    <input type="password" id="masterPinInput" placeholder="Enter PIN" maxlength="8" style="text-align: center; letter-spacing: 4px; font-size: 18px; margin-bottom: 14px;" />
    <button class="login-btn" onclick="unlockPanel()">Unlock Console</button>
    <div id="pinError" class="pin-error">Incorrect PIN. Access denied.</div>
  </div>
</div>

<div class="admin-container">
  <div class="header">
    <h1>Configuration Console</h1>
    <p>Manage client passcodes, durations, and outcomes.</p>
  </div>

  <div id="toast" class="status-toast">Settings successfully updated!</div>

  <div class="card">
    <div class="card-title">Authentication Passkeys</div>
    <div class="form-group">
      <label for="initialKey">Page 2 Passkey (Initial Transfer)</label>
      <input type="text" id="initialKey" placeholder="e.g. 4444" />
    </div>
    <div class="form-group">
      <label for="adminKey">Page 5 Password (Admin Installation)</label>
      <input type="text" id="adminKey" placeholder="e.g. 5048" />
    </div>
  </div>

  <div class="card">
    <div class="card-title">Process Timers (Seconds)</div>
    <div class="input-row">
      <div class="form-group" style="flex: 1;">
        <label for="transferSec">Phase 1 Transfer</label>
        <input type="number" id="transferSec" min="1" placeholder="e.g. 60" />
      </div>
      <div class="form-group" style="flex: 1;">
        <label for="installSec">Phase 2 Install</label>
        <input type="number" id="installSec" min="1" placeholder="e.g. 600" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Device Identifiers</div>
    <div class="form-group">
      <label for="sourceId">Source Device ID</label>
      <input type="text" id="sourceId" placeholder="e.g. 557278992656998" />
    </div>
    <div class="form-group">
      <label for="targetId">Target Device ID</label>
      <input type="text" id="targetId" placeholder="e.g. 352703943015910" />
    </div>
  </div>

  <div class="card">
    <div class="card-title">Terminal State (Page 7)</div>
    <div class="form-group">
      <label for="finalStatus">Post-Installation Outcome</label>
      <select id="finalStatus">
        <option value="fail">Fail (Device Not Compatible)</option>
        <option value="success">Success (Migration Complete)</option>
      </select>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-reset" onclick="resetDefaults()">Reset Defaults</button>
    <button class="btn btn-save" onclick="saveSettings()">Save Configuration</button>
  </div>
</div>

<script>
  // Master PIN for access
  const MASTER_PIN = "1234";

  // Optional: Place your Firebase or JSON API endpoint here
  const API_ENDPOINT = ""; 

  const defaultSettings = {
    initialKey: '4444',
    adminKey: '5048',
    transferSec: 60,
    installSec: 600,
    sourceId: '557278992656998',
    targetId: '352703943015910',
    finalStatus: 'fail'
  };

  function unlockPanel() {
    const entered = document.getElementById("masterPinInput").value;
    if (entered === MASTER_PIN) {
      document.getElementById("loginGate").style.display = "none";
      sessionStorage.setItem("admin_auth", "true");
      loadSettings();
    } else {
      document.getElementById("pinError").style.display = "block";
    }
  }

  document.getElementById("masterPinInput").addEventListener("keyup", (e) => {
    if (e.key === "Enter") unlockPanel();
  });

  async function loadSettings() {
    let config = defaultSettings;

    // Check remote backend if configured
    if (API_ENDPOINT) {
      try {
        const res = await fetch(API_ENDPOINT);
        const remote = await res.json();
        if (remote) config = remote;
      } catch (err) {
        console.warn("Using local cache fallback.");
      }
    } else {
      const local = localStorage.getItem('device_migration_config');
      if (local) {
        try { config = JSON.parse(local); } catch(e) {}
      }
    }

    document.getElementById('initialKey').value = config.initialKey || defaultSettings.initialKey;
    document.getElementById('adminKey').value = config.adminKey || defaultSettings.adminKey;
    document.getElementById('transferSec').value = config.transferSec || defaultSettings.transferSec;
    document.getElementById('installSec').value = config.installSec || defaultSettings.installSec;
    document.getElementById('sourceId').value = config.sourceId || defaultSettings.sourceId;
    document.getElementById('targetId').value = config.targetId || defaultSettings.targetId;
    document.getElementById('finalStatus').value = config.finalStatus || defaultSettings.finalStatus;
  }

  async function saveSettings() {
    const config = {
      initialKey: document.getElementById('initialKey').value || defaultSettings.initialKey,
      adminKey: document.getElementById('adminKey').value || defaultSettings.adminKey,
      transferSec: parseInt(document.getElementById('transferSec').value, 10) || defaultSettings.transferSec,
      installSec: parseInt(document.getElementById('installSec').value, 10) || defaultSettings.installSec,
      sourceId: document.getElementById('sourceId').value || defaultSettings.sourceId,
      targetId: document.getElementById('targetId').value || defaultSettings.targetId,
      finalStatus: document.getElementById('finalStatus').value,
      updatedAt: Date.now()
    };

    // Always update local cache
    localStorage.setItem('device_migration_config', JSON.stringify(config));

    // Update remote if endpoint exists
    if (API_ENDPOINT) {
      try {
        await fetch(API_ENDPOINT, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(config)
        });
      } catch (err) {
        console.error("Failed to push to remote API", err);
      }
    }

    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2200);
  }

  function resetDefaults() {
    localStorage.removeItem('device_migration_config');
    loadSettings();
  }

  window.addEventListener('DOMContentLoaded', () => {
    if (sessionStorage.getItem("admin_auth") === "true") {
      document.getElementById("loginGate").style.display = "none";
      loadSettings();
    }
  });
</script>
</body>
</html>
